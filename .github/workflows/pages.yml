name: نشر برنامج حضور العمال على صفحات GitHub

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4
      - name: إعداد صفحات GitHub
        uses: actions/configure-pages@v5
          with:
            enablement: true
      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4
