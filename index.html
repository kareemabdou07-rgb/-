let W=JSON.parse(localStorage.getItem('f5w')||'[]'),A=JSON.parse(localStorage.getItem('f5a')||'[]'),mode='day';const $=x=>document.getElementById(x);function save(){localStorage.setItem('f5w',JSON.stringify(W));localStorage.setItem('f5a',JSON.stringify(A))}function p(n){return String(n).padStart(2,'0')}function today(){let d=new Date();return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}function tm(){let d=new Date();return p(d.getHours())+':'+p(d.getMinutes())}function sh(t){return t<'14:00'?'1':'2'}function clock(){let d=new Date();$('clock').textContent=d.toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' — '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}setInterval(clock,1000);clock();$('rd').value=today();$('rm').value=today().slice(0,7);function refresh(){ $('sel').innerHTML='<option value="">اختر العامل</option>'+W.map(w=>`<option value="${w.id}">${w.name} — ${w.job||'—'} — ${w.typ} — بصمة ${w.fp||'—'}</option>`).join('')}function addW(){let name=$('nm').value.trim();if(!name)return alert('اكتب اسم العامل');let w={id:Date.now()+Math.random(),name,job:$('job').value.trim(),typ:$('typ').value,fp:$('fp').value.trim(),note:$('note').value.trim()||'أول يوم جديد'};W.push(w);save();refresh();['nm','job','fp','note'].forEach(id=>$(id).value='');alert('تم حفظ العامل')}function mark(w){let d=today(),t=tm();if(A.some(a=>a.w===w.id&&a.d===d))return false;A.push({w:w.id,d,t,s:sh(t)});save();return true}function attManual(){let w=W.find(x=>String(x.id)===$('sel').value);if(!w)return alert('اختر العامل');alert(mark(w)?'تم تسجيل الحضور: '+w.name:w.name+' مسجل حضور اليوم بالفعل');render()}function norm(s){return s.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْ]/g,'').replace(/\s+/g,' ').trim().toLowerCase()}function find(s){let n=norm(s);return W.find(w=>norm(w.name)===n)||W.find(w=>norm(w.name).includes(n)||n.includes(norm(w.name)))}let R=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false,restarting=false;
function paintMic(on){const b=$('mic');b.classList.toggle('on',on);b.classList.remove('ok');b.querySelector('.micText').textContent=on?'جاري التسجيل — قل اسم العامل':'اضغط لبدء التسجيل'}
async function startVoice(){
  if(listening)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('voice').textContent='هذا الجهاز/المتصفح لا يدعم تشغيل الميكروفون هنا. افتح البرنامج في Chrome عبر HTTPS.';
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    if(!R){
      $('voice').textContent='الميكروفون مسموح، لكن التعرف على الكلام غير مدعوم في هذا المتصفح. استخدم Chrome.';
      return;
    }
    rec=new R();
    rec.lang='ar-EG'; rec.continuous=true; rec.interimResults=false; rec.maxAlternatives=5;
    listening=true; paintMic(false); $('voice').textContent='الميكروفون جاهز — جاري تشغيل التعرف على الكلام...';
    rec.onstart=()=>{ listening=true; paintMic(true); $('voice').textContent='الميكروفون يعمل الآن — قل اسم العامل'; };
    rec.onaudiostart=()=>{ listening=true; paintMic(true); };
    rec.onspeechstart=()=>{ paintMic(true); $('voice').textContent='سمعتك — جاري التعرف على الاسم...'; };
    rec.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ if(!e.results[i].isFinal)continue; const text=e.results[i][0].transcript.trim(); const n=norm(text); if(['ستوب','استوب','إستوب','ايقاف','إيقاف','وقف','قف','توقف'].some(x=>n.includes(norm(x)))){stopVoice();return;} const w=find(text); if(w){const ok=mark(w); $('mic').classList.add('ok'); $('voice').textContent=ok?'تم تسجيل حضور '+w.name+' — الوردية '+sh(tm()):w.name+' مسجل حضور اليوم بالفعل'; setTimeout(()=>{if(listening){$('mic').classList.remove('ok');paintMic(true)}},700);} else { $('voice').textContent='العامل غير مسجل: '+text; $('nm').value=text; $('note').value='أول يوم جديد'; } render(); }};
    rec.onerror=e=>{ if(!listening)return; const m={notallowed:'تم رفض الميكروفون. افتح إعدادات Chrome > أذونات الموقع > الميكروفون واسمح به.','service-not-allowed':'التعرف على الصوت يحتاج Chrome على رابط HTTPS.','audio-capture':'لا يوجد ميكروفون متاح على الجهاز.',network:'تعذر الاتصال بخدمة التعرف على الصوت.'}; $('voice').textContent=m[e.error]||('خطأ في الميكروفون: '+e.error); if(['notallowed','service-not-allowed','audio-capture'].includes(e.error)) stopVoice(); };
    rec.onend=()=>{ if(listening){ paintMic(false); $('voice').textContent='الميكروفون متاح — إعادة تشغيل التعرف...'; setTimeout(()=>{if(listening)try{rec.start()}catch(e){}},350); } };
    rec.start();
  }catch(e){listening=false;paintMic(false);$('voice').textContent=e.name==='NotAllowedError'?'تم رفض إذن الميكروفون. اسمح بالميكروفون من Chrome.':'تعذر تشغيل الميكروفون: '+(e.message||e);}
}
function stopVoice(){listening=false;if(rec){try{rec.onend=null;rec.stop()}catch(e){}rec=null}paintMic(false);$('voice').textContent='تم إيقاف التسجيل — اضغط مرة أخرى للبدء';}
